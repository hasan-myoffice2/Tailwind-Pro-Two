<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>smartShop | web</title>
   <!-- Swiper JS CDN Link -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
   <!-- Bootstrap Icons Link-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
   <!-- Tailwind CSS Link -->
   <link rel="stylesheet" href="./src/output.css">
</head>

<body>
   <!-- header start -->
   <div class="bg-[#F5F5F5] border-b border-gray-200 py-2 lg:py-2 px-4 text-sm text-gray-600">
      <div class="flex items-center justify-between">

         <!-- Left Side: Contact Info -->
         <div class="flex flex-wrap items-center lg:gap-6 gap-2">
            <!-- Phone -->
            <a href="tel:+01744703580" class="flex items-center gap-2 hover:text-activeColor transition-colors">
               <!-- Phone Icon SVG -->
               <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
               </svg>
               <span class="font-medium font-DmSans hidden lg:block">+01744703580</span>
            </a>

            <!-- Email -->
            <a href="mailto:plancodedeploy@gmail.com"
               class="flex items-center gap-2 hover:text-activeColor transition-colors">
               <!-- Email Icon SVG -->
               <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                  </path>
               </svg>
               <span class="font-medium font-DmSans hidden lg:block">plancodedeploy@gmail.com</span>
            </a>
         </div>

         <!-- Right Side: Account, Wishlist, Selectors -->
         <div class="flex items-center lg:gap-6 gap-2">
            <!-- Account Dropdown -->
            <div class="flex items-center gap-1 relative cursor-pointer hover:text-activeColor" id="profileIcon">
               <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
               </svg>
               <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
               </svg>
               <div class="w-64 absolute top-10 rounded-xl bg-white p-4 shadow-cardShadow hidden" id="profileCard">
                  <!-- User Profile Section -->
                  <div class="flex items-center gap-3 pb-4 border-b border-gray-100">
                     <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="Nancy Miller"
                        class="h-12 w-12 rounded-full object-cover" />
                     <span class="font-medium text-gray-800 text-lg">Nancy Miller</span>
                  </div>

                  <!-- Menu Links -->
                  <nav class="flex flex-col pt-3 space-y-1">
                     <a href="#profile" class="rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-50 transition-colors">
                        My Profile
                     </a>
                     <a href="#orders" class="rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-50 transition-colors">
                        Order List
                     </a>
                     <a href="#logout"
                        class="rounded-lg px-3 py-2 text-sky-500 hover:bg-sky-50 transition-colors font-medium">
                        Log Out
                     </a>
                  </nav>
               </div>
            </div>

            <!-- Wishlist Icon -->
            <a href="#" class="hover:text-activeColor transition-colors">
               <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                  </path>
               </svg>
            </a>

            <!-- Language Selector -->
            <select
               class="bg-white border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-activeColor cursor-pointer">
               <option>English</option>
               <option>Spanish</option>
               <option>Italiano</option>
            </select>

            <!-- Currency Selector -->
            <select
               class="bg-white border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-activeColor cursor-pointer">
               <option>$ USD</option>
               <option>€ EUR</option>
               <option>€ UKP</option>
               <option>€ JPY</option>
            </select>
         </div>

      </div>
   </div>
   <!-- header end -->

   <script>
      const profileIcon = document.getElementById('profileIcon');
      const profileCard = document.getElementById('profileCard');
      profileIcon.addEventListener('click', () => {
         if (profileCard.style.display === 'block') {
            profileCard.style.display = 'none'
         } else {
            profileCard.style.display = 'block'
         }
      })
   </script>

</body>

</html>
